# nightshift 网页的 nginx location 片段。
# 用法：把下面几段放进你的 server {} 里；登录限速的 zone 要先在 http {} 层定义：
#   limit_req_zone $binary_remote_addr zone=nightshift_login:10m rate=5r/m;
# 注意 proxy_pass 末尾带不带 "/" 的区别：/nightshift/ 这段会把前缀剥掉，
# 应用看到的是 / 、/api/... ——所以网页里的资源引用必须用相对路径。

# 登录接口单独限速，慢速爆破在这里就被挡住
location = /nightshift/api/login {
    limit_req zone=nightshift_login burst=3 nodelay;
    proxy_pass http://127.0.0.1:8190/api/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# /nightshift（不带斜杠）补斜杠，避免相对路径资源 404
location = /nightshift {
    return 301 /nightshift/;
}

location /nightshift/ {
    proxy_pass http://127.0.0.1:8190/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
